name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  publish:
    permissions:
      contents: read
      packages: write
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # 正式标签必须与项目版本一致，避免发布错版。
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || [[ "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
              echo "正式标签必须为 v主版本.次版本.修订版本，且与 package.json 版本一致。" >&2
              exit 1
            fi
          fi
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "${IMAGE}:${VERSION}"
              echo "${IMAGE}:latest"
            elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
              echo "${IMAGE}:edge"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64 and arm64
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,timeout=2m,ignore-error=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
      - name: Verify published platforms
        shell: bash
        run: |
          set -euo pipefail
          # GHCR 发布后可能短暂读取不到新摘要，有限重试后再验证平台。
          verified=false
          for attempt in 1 2 3 4 5; do
            echo "镜像索引校验，第 ${attempt} 次尝试"
            if docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw > /tmp/image-index.json; then
              verified=true
              break
            fi
            sleep 3
          done
          if [[ "$verified" != true ]]; then exit 1; fi
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")' /tmp/image-index.json
          {
            echo '### Published image'
            echo "\`${IMAGE}@${DIGEST}\`"
            echo ''
            echo 'Platforms: linux/amd64, linux/arm64'
            echo ''
            echo '```sh'
            while IFS= read -r tag; do echo "docker pull ${tag}"; done <<< "$IMAGE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
